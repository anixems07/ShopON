<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ShopON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="split-layout">
        <div class="split-visual">
            <div class="visual-content">
                <a class="nav-logo split-logo" href="index.html">
                    <i class="fa-solid fa-basket-shopping"></i> ShopON
                </a>
                <div class="visual-text">
                    <h1>Join the future<br>of commerce.</h1>
                    <p>Start your journey with us today and discover a world of premium goods.</p>
                </div>
            </div>
            <img class="visual-img" src="images/ecommerce_hero.png" alt="ShopON Premium">
        </div>
        
        <div class="split-form">
            <div class="split-form-inner">
                <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
                <h2>Create Account</h2>
                <form id="registerForm">
                    <div class="form-group" style="margin-bottom: 24px;">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="Your name" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 24px;">
                        <label>Email Address</label>
                        <input type="email" id="registerEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 32px;">
                        <label>Password</label>
                        <input type="password" id="registerPassword" placeholder="Create a password" required>
                    </div>
                    <button type="submit" class="auth-btn">
                        Create account <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>
                    </button>
                </form>
                <div class="auth-footer">
                    Already have an account? <a href="login.html">Log in here</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
